<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomb Squad 3D Arena</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h1>⚔️ BOMB SQUAD</h1>
      <form id="join-form" class="join-form">
        <label>Your Name
          <input id="player-name" type="text" maxlength="16" value="Player" />
        </label>
        <label>Room Code
          <input id="room-code" type="text" maxlength="8" value="ARENA" />
        </label>
        <label>Select Team
          <select id="team-select">
            <option value="blue">🔵 Blue Team</option>
            <option value="red">🔴 Red Team</option>
          </select>
        </label>
        <button type="submit">🎮 Enter Arena</button>
      </form>
      <div class="info-panel">
        <h3>⌨️ Controls</h3>
        <ul>
          <li><strong>WASD</strong> - Move</li>
          <li><strong>SPACE</strong> - Drop Bomb</li>
          <li><strong>F</strong> - Capture Flag</li>
        </ul>
        <h3>🎯 Objective</h3>
        <p>Grab enemy flag & bring it home!</p>
      </div>
    </aside>
    <main class="game-viewport">
      <canvas id="game-canvas" width="1024" height="640"></canvas>
      <div id="hud" class="hud"></div>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
